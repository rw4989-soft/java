server.port=8081

# ===================== MySQL 数据源 =====================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/spongebob?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ===================== MyBatis-Plus =====================
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis-plus.global-config.db-config.id-type=auto
mybatis-plus.global-config.banner=false

# ===================== 静态资源 =====================
# 前端重新 npm run build 之后，浏览器刷新就应该拿到新版本。
# 不加这句的话 index.html 没有 Cache-Control，浏览器会做「启发式缓存」，
# 表现就是「代码明明改了、页面还是旧的」，得手动 Ctrl+F5 强刷。
spring.web.resources.cache.cachecontrol.no-cache=true
